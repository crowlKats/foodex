name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: lint, typecheck, test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: deno install --allow-scripts

      # `deno task check` = deno fmt --check + deno lint + vite build
      # (also generates .fresh/types) + deno task typecheck.
      - name: Check (fmt, lint, build, typecheck)
        run: deno task check

      - name: Test
        run: deno task test
